[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "finagentbench"
version = "0.5.0"
description = "Evidence-grounded financial reasoning benchmarks for agentic LLM harnesses"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "GlacierAlgo" }]
dependencies = ["click>=8.1,<9"]

[project.scripts]
finagentbench = "finagentbench.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[tool.setuptools.package-data]
finagentbench = [
  "cases/*.json",
  "a_share/scenarios/*.json",
  "a_share/corpora/*.json",
  "a_share/labels/*.json",
  "live_shadow/scenarios/*.json",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
