[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pitfall"
version = "0.17.0"
description = "Pointwise financial reasoning evaluations for agentic LLM harnesses"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "GlacierAlgo" }]
dependencies = ["click>=8.1,<9"]

[project.scripts]
pitfall = "pitfall.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[tool.setuptools.package-data]
pitfall = [
  "points/*.md",
  "points/*/*.md",
  "a_share/dossiers/*.json",
  "live_shadow/scenarios/*.json",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
